<style>
/* 手绘笔记版：一整页手写笔记，镜头顺着旁白往下走 */
:root{--paper:#f6f1e4;--ink:#2b2a28;--red:#d9443b;--blue:#2f5fb3;--pen:#8a8578;--band:#efe7d3}
html,body{margin:0;background:var(--paper)}
#stage{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--paper);font-family:"LXGW WenKai",serif;color:var(--ink)}
#page{position:absolute;left:0;top:0;width:1080px;transform-origin:0 0;background-color:var(--paper);

#tex{position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply}
.lay{position:absolute;left:0;top:0;width:1080px;height:100%}

.print{position:absolute;background:#fffdf7;padding:12px 12px 8px;box-shadow:0 8px 20px rgba(60,45,20,.22),0 1px 3px rgba(0,0,0,.18);transform-origin:50% 0}
.print img{display:block;width:100%}
.print.photo img{filter:sepia(.18) contrast(1.03)}
.print .pc{font-size:26px;color:var(--pen);margin-top:6px;text-align:center;white-space:nowrap}
.tape{position:absolute;width:118px;height:36px;background:rgba(232,216,170,.78);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#band{position:absolute;left:0;right:0;bottom:0;height:250px;background:var(--band)}
#band:before{content:"";position:absolute;left:0;right:0;top:-46px;height:46px;background:linear-gradient(rgba(239,231,211,0),var(--band))}
#bline{position:absolute;left:0;top:0;overflow:visible}
#cap{position:absolute;left:50px;right:50px;top:66px;height:100px;display:flex;align-items:center;justify-content:center;font-size:48px;white-space:nowrap}
#cap .k{background:linear-gradient(transparent 56%,rgba(255,214,70,.9) 56%,rgba(255,214,70,.9) 90%,transparent 90%)}
#tag{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:28px;color:var(--red)}
#refs{position:absolute;left:56px;right:56px;top:22px;font-size:20px;line-height:1.36;color:#7a7466}
#refs b{color:var(--ink);font-weight:700}
#brand{position:absolute;right:44px;bottom:16px;font-size:24px;color:var(--pen);letter-spacing:3px}
#card{position:absolute;left:0;top:0;width:1080px;height:1194px;background:#fbf8ef;box-shadow:0 -6px 30px rgba(60,45,20,.25);
  background-image:repeating-linear-gradient(transparent 0 69px,rgba(80,120,200,.2) 69px 71px);background-position:0 40px}
#card:before{content:"";position:absolute;left:118px;top:0;bottom:0;width:2px;background:rgba(217,68,59,.45)}
</style></head>

<div id="page"><div id="tex"></div><div class="lay" id="hlL"></div><svg id="ink" width="1080"></svg><div class="lay" id="picL"></div><div class="lay" id="txtL"></div></div>
<div id="card"><div class="lay" id="chl"></div><svg id="cink" width="1080" height="1194"></svg><div class="lay" id="ctx"></div></div>

<script>
(function () {
  const { h, s, p, ease, clamp, lerp, rng } = E;
  const INK = '#2b2a28', RED = '#d9443b', BLUE = '#2f5fb3', PEN = '#8a8578';
  const VIEW = 1185;                                   // visible page height above the caption band
  const $ = id => document.getElementById(id);
  const PAGE = { svg: $('ink'), hl: $('hlL'), pic: $('picL'), txt: $('txtL'), items: [] };
  const CARD = { svg: $('cink'), hl: $('chl'), pic: $('ctx'), txt: $('ctx'), items: [] };
  const CAMS = [], IMGS = [];
  let Y = 0, seedN = 1, END = null;

  // ---------- hand-drawn strokes: resample, jitter sideways, smooth; three jitter variants "boil" at 8 fps ----------
  function wob(pts, seed, amp, step) {
    const r = rng(seed), out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], L = Math.hypot(x1 - x0, y1 - y0) || 1;
      const n = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
      for (let k = 0; k < n; k++) { const u = k / n, j = (r() - 0.5) * 2 * amp; out.push([x0 + (x1 - x0) * u + nx * j, y0 + (y1 - y0) * u + ny * j]); }
    }
    const l = pts[pts.length - 1]; out.push([l[0] + (r() - 0.5) * amp, l[1] + (r() - 0.5) * amp]);
    return out;
  }
  function pathD(q) {
    let d = `M${q[0][0].toFixed(1)} ${q[0][1].toFixed(1)}`;
    if (q.length === 2) return d + `L${q[1][0].toFixed(1)} ${q[1][1].toFixed(1)}`;
    for (let i = 1; i < q.length - 1; i++) d += `Q${q[i][0].toFixed(1)} ${q[i][1].toFixed(1)} ${((q[i][0] + q[i + 1][0]) / 2).toFixed(1)} ${((q[i][1] + q[i + 1][1]) / 2).toFixed(1)}`;
    const l = q[q.length - 1]; return d + `L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;
  }
  const plen = q => q.reduce((a, c, i) => a + (i ? Math.hypot(c[0] - q[i - 1][0], c[1] - q[i - 1][1]) : 0), 0);
  const ellPts = (cx, cy, rx, ry, a0 = -2.2, sweep = 6.283 + 0.35, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + sweep * i / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  const rectPts = (x, y, w, hh) => [[x, y + 2], [x + w, y], [x + w + 1, y + hh], [x - 1, y + hh + 1], [x + 1, y - 3]];

  // ---------- a kit of drawing calls for one section; Y0 = section top on the page ----------
  function kit(sc, Y0, tg) {
    const K = { Y0 };
    K.sub = dy => kit(sc, Y0 + dy, tg);
    K.T = (c, off = 0) => { const v = E.cue(sc, c); if (!isFinite(v)) { console.error('missing cue ' + sc.id + ':' + c); return 1e9; } return sc.start + v + off; };
    K.stroke = (pts, at, o = {}) => {
      pts = pts.map(([x, y]) => [x, y + Y0]);
      const sd = seedN++ * 7, amp = o.amp == null ? 1.3 : o.amp;
      const vars = [0, 1, 2].map(i => pathD(wob(pts, sd + i * 101, amp, o.step || 16)));
      const el = s('path', { d: vars[0], fill: o.fill || 'none', stroke: o.color || INK, 'stroke-width': o.w || 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': o.dash || '1 1' });

      it.up = (t, bi, vis) => {

        if (k <= 0) { el.style.opacity = 0; return; }

    };

    K.ell = (cx, cy, rx, ry, at, o) => K.stroke(ellPts(cx, cy, rx, ry), at, Object.assign({ step: 12 }, o));
    K.arrow = (x0, y0, x1, y1, at, o = {}) => {
      const a = K.stroke([[x0, y0], [x1, y1]], at, o), L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L, hs = o.head || 18;

    };
    K.text = (x, y, str, at, o = {}) => {

        t0 += dur * 0.92;

    };

    };
    K.photo = (name, x, y, w, at, o = {}) => {
      const img = h('img', { src: E.TL.meta.figs[name] });
      IMGS.push(img);
      const el = h('div', { class: 'print' + (o.photo ? ' photo' : ''), style: { left: x + 'px', top: (Y0 + y) + 'px', width: (w - 24) + 'px' } }, img, h('div', { class: 'pc', text: o.cap || '' }));
      E.warm = (E.warm || '') + (o.cap || '');
      const t1 = h('i', { class: 'tape', style: { left: '-34px', top: '-12px', transform: 'rotate(-28deg)' } }), t2 = h('i', { class: 'tape', style: { right: '-34px', top: '-12px', transform: 'rotate(30deg)' } });
      el.append(t1, t2);

      tg.items.push({ y0: Y0 + y, y1: Y0 + y + 600, up: t => {
        const k = p(t, at, 0.55, ease.out);

        el.style.transform = `translateY(${((1 - k) * -26).toFixed(1)}px) rotate(${(rot + (1 - k) * 3).toFixed(2)}deg) scale(${(1.04 - 0.04 * k).toFixed(3)})`;
      } });
    };
    K.num = (x, y, n, at) => { K.ell(x, y, 30, 30, at, { color: RED, w: 3 }); K.text(x - 11, y - 25, String(n), at + 0.3, { size: 40, color: RED, bold: true, rot: 0 }); };
    K.cam = (at, y, z = 1, dur = 1.0) => CAMS.push({ at, y: Y0 + y, z, dur });
    K.head = (n, title, at) => { K.num(178, 75, n, at); const e = K.text(232, 44, title, at + 0.2, { size: 54, bold: true, rot: 0 }); K.stroke([[232, 122], [232 + [...title].length * 50, 118]], e, { color: RED, w: 3 }); };
    return K;
  }

  // ---------- sections ----------
  const SEC = {};
  SEC.hook = (K, sc) => {
    const t0 = sc.start, tb = K.T('clip_bath'), tl = K.T('clip_living');

    K.stroke([[880, 182], [940, 182], [955, 230], [866, 230], [880, 182]], tl + 1.4, { w: 3 }); K.stroke([[910, 230], [910, 300]], tl + 1.6, { w: 3 });
    K.stroke([[700, 360], [760, 330], [735, 312]], tl + 1.7, { color: BLUE, w: 3, dur: 0.5 });
    K.ell(692, 362, 13, 9, tl + 1.6, { color: BLUE, fill: BLUE, w: 2 }); K.stroke([[704, 360], [704, 312]], tl + 1.65, { color: BLUE, w: 3 });
    K.text(590, 548, '客厅', tl + 0.3, { size: 44, bold: true });

  SEC.scope = (K, sc) => {
    const ta = K.T('alias');
    K.text(150, 30, '也叫：室内声学  Room Acoustics', ta, { size: 44 });
    K.stroke([[150, 96], [710, 92]], ta + 1.0, { color: RED, w: 3 });
    const icon = [
      (x, y, a) => { K.stroke([[x + 10, y + 140], [x + 10, y + 45], [x + 120, y + 5], [x + 230, y + 45], [x + 230, y + 140], [x + 10, y + 140]], a); K.rect(x + 90, y + 58, 60, 26, a + 0.5, { w: 2.6 });
                     [100, 117, 134].forEach((yy, i) => K.stroke([[x + 40, y + yy], [x + 80, y + yy - 6], [x + 120, y + yy - 8], [x + 160, y + yy - 6], [x + 200, y + yy]], a + 0.7 + i * 0.1, { w: 2.2, color: PEN })); },
      (x, y, a) => { K.rect(x + 10, y + 50, 26, 90, a); K.rect(x + 36, y + 92, 194, 34, a + 0.3); K.ell(x + 72, y + 80, 28, 11, a + 0.6, { w: 2.6 }); K.stroke([[x + 110, y + 92], [x + 150, y + 82], [x + 190, y + 90], [x + 228, y + 84]], a + 0.7, { w: 2.4 }); K.stroke([[x + 226, y + 126], [x + 226, y + 146]], a + 0.8); },
      (x, y, a) => { K.rect(x + 20, y + 8, 200, 92, a); K.stroke([[x + 45, y + 45], [x + 80, y + 35], [x + 110, y + 50], [x + 150, y + 38], [x + 185, y + 48]], a + 0.5, { color: PEN, w: 2.2 }); K.stroke([[x + 45, y + 72], [x + 130, y + 70]], a + 0.7, { color: PEN, w: 2.2 });
                     K.stroke([[x + 25, y + 128], [x + 110, y + 128]], a + 0.8); K.stroke([[x + 130, y + 128], [x + 215, y + 128]], a + 0.9); K.stroke([[x + 40, y + 128], [x + 40, y + 148]], a + 1); K.stroke([[x + 200, y + 128], [x + 200, y + 148]], a + 1); },

                     [112, 138].forEach((yy, i) => K.stroke(Array.from({ length: 13 }, (_, j) => [x + 25 + j * 16, y + yy - (j % 2 ? 9 : 0)]), a + 0.6 + i * 0.15, { w: 2.2 })); },
      (x, y, a) => { [[10, 62], [130, 62], [10, 118], [130, 118]].forEach(([dx, dy], i) => { K.rect(x + dx, y + dy, 100, 28, a + i * 0.15, { w: 2.6 }); K.rect(x + dx + 32, y + dy - 30, 36, 24, a + 0.2 + i * 0.15, { w: 2.2 }); });
                     K.stroke([[x + 110, y + 10], [x + 125, y + 2], [x + 140, y + 10], [x + 155, y + 2]], a + 0.9, { color: RED, w: 2.2 }); },

                     K.stroke([[x + 128, y + 46], [x + 128, y + 82]], a + 0.7, { w: 2.4 }); K.ell(x + 108, y + 66, 12, 12, a + 0.8, { w: 2.2, color: RED }); },

    names.forEach((nm, i) => {

    K.text(150, 1420, '汽车、火车 → 虚拟现实 → 城市规划', tc, { size: 40, dur: 1.6 });
    K.text(150, 1484, '还在图纸上，居民就能先听到', tc + 1.8, { size: 40, color: RED });
    K.hl(146, 1528, 250, 22, tc + 3.2);
    const tg = K.T('game');
    K.text(150, 1590, '现在：游戏、VR（Reality Labs，前 Oculus）', tg, { size: 36 });
    const to = K.T('open');
    K.text(150, 1680, '还没解决：', to, { size: 44, bold: true, color: RED });
    [['实时 → 只能用简化的几何声学', K.T('open', 1.6)], ['回放照顾不了多个听众', K.T('multi')], ['大声源、移动声源，建模不成熟', K.T('big')]].forEach(([txt, a], i) => {
      K.rect(156, 1764 + i * 66, 30, 30, a, { w: 2.6, dur: 0.25 });
      K.text(204, 1752 + i * 66, txt, a + 0.2, { size: 38 });
    });
    K.cam(K.T('e5', -0.4), -30);
    K.cam(K.T('book', -0.6), 330);
    K.cam(K.T('city', -0.6), 860);
    return 2000;
  };

  SEC.end = (K, sc) => {
    END = { sc, zoom: K.T('zoom'), card: K.T('young', 0.2), ask: K.T('ask') };
    buildCard(sc);
    return 0;
  };

  function buildCard(sc) {
    const K = kit(sc, 0, CARD), a = END.card + 0.5;
    K.text(150, 60, '建筑声学 · 一张图', a, { size: 66, bold: true, rot: 0 });
    K.hl(146, 116, 560, 26, a + 0.8);
    const rows = [
      ['~1930  起步', '赛宾 · 混响时间 · T = 0.16 V/A · 波士顿交响乐大厅'],
      ['1930–1960  早期科学探索', '德国学派 · 消声室 · 房间响应 · 马大猷'],
      ['1960–1980  大面积参数化', '脉冲响应 · 施罗德频率 · C / EDT / IACC / G …'],
      ['1980–  电脑时代', '仿真软件 · 几何声学 vs 数值声学 · Round Robin'],
      ['1990–  可听化', '房子没盖先听见 · VR · 移动声源'],
    ];
    rows.forEach(([hd, kw], i) => {
      const y = 214 + i * 142, t = a + 0.6 + i * 0.45;
      K.ell(70, y + 30, 26, 26, t, { color: RED, w: 2.8 }); K.text(60, y + 8, String(i + 1), t + 0.1, { size: 36, color: RED, bold: true, rot: 0 });
      K.text(150, y, hd, t + 0.1, { size: 44, bold: true, rot: 0, dur: 0.5 });
      K.text(150, y + 62, kw, t + 0.3, { size: 32, color: '#4b4842', rot: 0, dur: 0.6 });
    });
    K.text(150, 960, '你待过回声最长的地方，是哪儿？', END.ask, { size: 48, color: RED, rot: -0.5 });
    K.stroke([[150, 1030], [400, 1036], [700, 1028], [880, 1034]], END.ask + 1.6, { color: RED, w: 3 });
  }

  // ---------- caption band ----------
  const cap = $('cap'), tag = $('tag'), refs = $('refs');
  let capKey = null, lastSay = null;
  const TAGS = { bath: '模拟 · 瓷砖小浴室', living: '模拟 · 有沙发窗帘的客厅' };
  function band(t) {
    let key = null, toks = null, txt = null, t0 = 0, tg = '';
    for (const sc of E.TL.scenes) {
      if (t < sc.start || t >= sc.end || !sc.data || !sc.data.lines) continue;
      const st = E.clipStep(sc, t);
      if (st) { key = 'clip:' + st.clip; txt = sc.data.lines[st.clip]; t0 = st.start; tg = TAGS[st.clip] || ''; }
    }
    if (!key) {
      const st = E.sayAt(t);
      if (st) {
        const lines = E.lines(st, 17); let ln = lines[0];
        for (const l of lines) if (t >= l.t0 - 0.1) ln = l;
        key = st.start + ':' + ln.i; toks = ln.toks; t0 = ln.t0 - 0.1;
      }
    }
    if (key !== capKey) {
      capKey = key;
      if (txt) cap.replaceChildren(h('span', { text: txt }));
      else if (toks) cap.replaceChildren(...toks.map((tk, i) => {
        let pu = tk.p; if (i === toks.length - 1) pu = pu.replace(/[，。；：、,.;:\s]+$/, '');
        const prev = i ? toks[i - 1].d + toks[i - 1].p : '', sp = /[A-Za-z0-9]$/.test(prev) && /^[A-Za-z]/.test(tk.d) ? ' ' : '';
        return h('span', { class: tk.hl ? 'k' : '', text: sp + tk.d + pu });
      }));
      else cap.replaceChildren();
      tag.textContent = tg;
    }
    cap.style.opacity = key ? p(t, t0, 0.16) : 0;
    tag.style.opacity = tg ? p(t, t0, 0.3) : 0;
    const kr = lastSay ? p(t, lastSay.end + 0.35, 0.6) : 0;
    refs.style.opacity = kr; if (kr > 0) cap.style.opacity = 0;
  }

  // ---------- paper texture ----------
  function texture() {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), r = rng(3), im = g.createImageData(256, 256);
    for (let i = 0; i < 256 * 256; i++) { const v = 200 + r() * 55; im.data[i * 4] = v; im.data[i * 4 + 1] = v * 0.97; im.data[i * 4 + 2] = v * 0.9; im.data[i * 4 + 3] = r() < 0.5 ? 40 : 14; }
    g.putImageData(im, 0, 0);
    $('tex').style.backgroundImage = `url(${c.toDataURL()})`;
  }

  let built = false, Htot = 0;
  function finish() {
    built = true; Htot = Y;
    const pg = $('page'); pg.style.height = Htot + 'px'; $('ink').setAttribute('height', Htot);
    const ml = s('line', { x1: 118, y1: 0, x2: 118, y2: Htot, stroke: 'rgba(217,68,59,.42)', 'stroke-width': 2 });
    $('ink').prepend(ml);
    if (END) {
      CAMS.push({ at: END.zoom, y: Htot - VIEW / 0.3, z: 0.3, dur: 1.5 });
      CAMS.push({ at: END.zoom + 1.6, y: 0, z: 0.3, dur: 3.0 });
    }
    CAMS.sort((a, b) => a.at - b.at);
    const says = E.says; lastSay = says[says.length - 1];
    const bl = $('bline'); const r = rng(4), pts = [];
    for (let x = 0; x <= 1080; x += 18) pts.push([x, 6 + (r() - 0.5) * 3]);
    bl.append(s('path', { d: pathD(pts), stroke: 'rgba(43,42,40,.35)', 'stroke-width': 2, fill: 'none' }));
    refs.innerHTML = '<b>参考</b>　' + E.TL.scenes[E.TL.scenes.length - 1].data.refs.join('<br>');
  }

  const scenes = {};
  for (const k of Object.keys(SEC)) scenes[k] = (sc, el) => { const K = kit(sc, Y, PAGE); Y += SEC[k](K, sc); return () => {}; };

  let first = true;
  E.start({
    fonts: ['400 40px "LXGW WenKai"', '700 40px "LXGW WenKai"'],
    extraText: '模拟瓷砖小浴室有沙发窗帘的客厅参考0123456789→≠·（）',
    layer: $('layer'),
    init() { texture(); },
    scenes,
    frame(t) {
      if (!built) finish();
      if (first) { first = false; IMGS.forEach(im => E.pending.push(im.decode().catch(() => {}))); }
      let y = CAMS[0].y, z = 1;
      for (const c of CAMS) { if (c.at > t) break; const k = p(t, c.at, c.dur, ease.io); y = lerp(y, c.y, k); z = lerp(z, c.z, k); }
      $('page').style.transform = `translate(${((1080 - 1080 * z) / 2).toFixed(2)}px, ${(-y * z).toFixed(2)}px) scale(${z.toFixed(4)})`;
      const bi = Math.floor(t * 8) % 3, top = y - 150, bot = y + VIEW / z + 150;
      for (const it of PAGE.items) it.up(t, bi, it.y1 >= top && it.y0 <= bot);
      if (END) {
        const kc = p(t, END.card, 0.8, ease.out);
        $('card').style.display = kc > 0 ? '' : 'none';
        $('card').style.transform = `translateY(${((1 - kc) * 1250).toFixed(1)}px) rotate(${((1 - kc) * 2).toFixed(2)}deg)`;
        if (kc > 0) for (const it of CARD.items) it.up(t, bi, true);
      }
    },
    after(t) { band(t); },
  });
})();
</script></body></html>
