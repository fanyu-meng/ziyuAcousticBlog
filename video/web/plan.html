<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">

<style>
/* 听房间版：建筑图纸风。纸、细线、一支红笔；没有发光、没有粒子。 */
:root{--paper:#eeece6;--grid:#e2dfd7;--grid2:#d6d1c6;--ink:#1d1c1a;--ink2:#5f5b53;--ink3:#a7a196;--red:#cf3c1b;--fill:#e4e0d6;
  --font:"Noto Sans SC",sans-serif;--num:"Space Grotesk","Noto Sans SC",sans-serif;--mono:"JetBrains Mono","Noto Sans SC",monospace}
html,body{margin:0;background:var(--paper)}
#stage{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--paper);font-family:var(--font);color:var(--ink)}
#sheet,#layer,#fixed{position:absolute;inset:0}
.scene{position:absolute;inset:0}
svg.dw{position:absolute;left:0;top:0;width:1080px;height:1440px;overflow:visible}
svg text{font-family:var(--font);fill:var(--ink)}
svg .mono{font-family:var(--mono)}
svg .num{font-family:var(--num)}
.stk{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.2}.ghost{stroke:var(--ink3)}.red{stroke:var(--red)}.dash{stroke-dasharray:6 7}
/* header */
#hno{position:absolute;left:84px;top:78px;font-family:var(--mono);font-size:26px;font-weight:700;color:var(--red);letter-spacing:2px}
#htitle{position:absolute;left:200px;top:72px;font-size:34px;font-weight:700;letter-spacing:1px;white-space:nowrap}
#hp{position:absolute;right:84px;top:76px;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:22px;color:var(--ink2);letter-spacing:2px}
#hp svg{width:40px;height:40px}
#hrule{position:absolute;left:84px;right:84px;top:138px;height:2px;background:var(--ink)}
/* captions: the whole sentence, typed fast, left-aligned like a note on the drawing */
#cap{position:absolute;left:84px;right:84px;top:1076px;height:180px;font-size:44px;line-height:1.55;font-weight:500;letter-spacing:.5px}
#cap .w{opacity:var(--k)}
#cap .w b{font-weight:500}#cap .w i{font-style:normal}
#cap .w.hl b{color:var(--red);font-weight:700}
#capbar{position:absolute;left:84px;top:1062px;width:56px;height:4px;background:var(--red)}
/* title block */
#tb{position:absolute;right:48px;bottom:48px;width:470px;height:118px;border-left:2px solid var(--ink);border-top:2px solid var(--ink);display:grid;grid-template-columns:96px 1fr 96px 92px;grid-template-rows:1fr 1fr;font-size:20px}
#tb div{border-right:1px solid var(--ink2);border-bottom:1px solid var(--ink2);display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
#tb .k{font-family:var(--mono);font-size:16px;color:var(--ink2);letter-spacing:1px}
#tb .v{font-weight:700}
#tb .no{font-family:var(--mono);font-weight:700;color:var(--red)}
#scale{position:absolute;left:84px;bottom:66px;font-family:var(--mono);font-size:18px;color:var(--ink2)}
/* html labels used inside scenes */
.lab{position:absolute;white-space:nowrap}
.big{font-family:var(--num);font-weight:700;letter-spacing:-2px;line-height:1}
.tag{font-family:var(--mono);font-size:20px;color:var(--ink2);letter-spacing:1px}
.rname{font-size:52px;font-weight:900;letter-spacing:2px}
.rno{font-family:var(--mono);font-size:24px;color:var(--red);font-weight:700}
.photo{position:absolute;background:#fff;padding:10px 10px 44px;box-shadow:0 1px 0 var(--ink2),0 14px 30px rgba(40,30,10,.18)}
.photo img{display:block;width:100%;filter:grayscale(.85) contrast(1.05) sepia(.12)}
.photo span{position:absolute;left:12px;right:12px;bottom:10px;font-size:18px;color:var(--ink2);font-family:var(--mono)}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);left:50%;top:-6px;margin-left:-8px;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.fx{font-family:var(--num);font-size:150px;font-weight:500;letter-spacing:-3px;display:flex;align-items:center;gap:26px}
.fx .frac{display:flex;flex-direction:column;align-items:center;line-height:1}
.fx .frac i{display:block;width:100%;height:5px;background:var(--ink);margin:14px 0}
.fx em{font-style:normal;color:var(--red)}
.fxl{font-size:30px;color:var(--ink2)}
.fxl b{color:var(--ink);font-family:var(--num);font-size:34px;margin-right:12px}
.idx{font-size:30px;line-height:1.9;font-weight:500}
.idx b{font-family:var(--mono);color:var(--red);font-size:24px;margin-right:24px}
.refs{font-family:var(--mono);font-size:17px;line-height:1.6;color:var(--ink2)}
</style></head>
<body><div id="stage">
<canvas id="sheet" width="1080" height="1440"></canvas>
<div id="layer"></div>
<div id="fixed">
  <div id="hno"></div><div id="htitle"></div><div id="hrule"></div>
  <div id="hp"><svg viewBox="0 0 40 40"><path class="stk" d="M7 24 V20 a13 13 0 0 1 26 0 V24" /><rect class="stk" x="5" y="23" width="7" height="12" rx="2"/><rect class="stk" x="28" y="23" width="7" height="12" rx="2"/></svg><span>戴上耳机</span></div>
  <div id="capbar"></div><div id="cap"></div>
  <div id="scale"></div>
  <div id="tb"><div class="k">项目</div><div class="v">建筑声学简史</div><div class="k">图号</div><div class="no" id="tbno"></div>
    <div class="k">图名</div><div class="v" id="tbname"></div><div class="k">绘制</div><div class="v" style="font-size:17px;padding:0 8px">子鱼说声学</div></div>
</div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  const { h, s, p, ease, clamp, lerp } = E;
  const IO = ease.io;
  // ---------- drawing helpers: every line is a path that draws itself on ----------
  function Pen(svg) {
    const items = [];
    const add = (d, t0, dur, cls = '', extra = {}) => {
      const el = s('path', Object.assign({ d, class: 'stk ' + cls, pathLength: 1 }, extra));
      svg.append(el); items.push({ el, t0, dur }); return el;
    };
    const fill = (d, t0, dur, color) => {
      const el = s('path', { d, fill: color, stroke: 'none' }); svg.insertBefore(el, svg.firstChild); items.push({ el, t0, dur, fill: true }); return el;
    };
    const update = lt => {
      for (const it of items) {
        if (it.t0 === Infinity) { it.el.style.opacity = 0; continue; }
        if (it.fill) { it.el.style.opacity = p(lt, it.t0, it.dur); continue; }
        const k = p(lt, it.t0, it.dur, IO);
        it.el.style.opacity = k > 0.001 ? 1 : 0;
        if (it.el.classList.contains('dash')) { it.el.style.strokeDasharray = ''; it.el.style.clipPath = ''; it.el.style.opacity = k; }
        else { it.el.style.strokeDasharray = '1 1'; it.el.style.strokeDashoffset = (1 - k).toFixed(4); }
      }
    };
    return { add, fill, update, items };
  }
  const M = (pts, close) => pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('') + (close ? 'Z' : '');
  const fade = (el, k, dy = 0) => { el.style.opacity = k; el.style.transform = dy ? `translateY(${((1 - k) * dy).toFixed(1)}px)` : ''; };
  const label = (parent, x, y, html, cls = 'tag', style = '') => { const e = h('div', { class: 'lab ' + cls, html, style: `left:${x}px;top:${y}px;${style}` }); parent.append(e); return e; };
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  // isometric projection fitted into a box
  function isoFit(W, D, H, box) {
    const pw = (W + D) * C30, ph = (W + D) * S30 + H;
    const sc = Math.min(box.w / pw, box.h / ph);
    const ox = box.x + box.w / 2 - (W - D) * C30 * sc / 2;
    const oy = box.y + box.h / 2 + (H * sc - (W + D) * S30 * sc) / 2;
    const P = (x, y, z) => [ox + (x - y) * C30 * sc, oy + (x + y) * S30 * sc - z * sc];
    P.sc = sc; return P;
  }
  // ---------- one room drawing (cut-away box, furniture, scale figure) ----------
  function roomStrokes(pen, R, P, t0) {
    const [W, D, H] = R.dims; let t = t0;
    const seg = (pts, dur = 0.35, cls = '', close) => { pen.add(M(pts.map(q => P(...q)), close), t, dur, cls); t += dur * 0.55; };
    const face = (pts, c) => pen.fill(M(pts.map(q => P(...q)), true), t0 + 0.5, 0.8, c);
    face([[0, 0, 0], [W, 0, 0], [W, D, 0], [0, D, 0]], 'rgba(60,50,35,.07)');
    face([[0, 0, 0], [W, 0, 0], [W, 0, H], [0, 0, H]], 'rgba(60,50,35,.035)');
    face([[0, 0, 0], [0, D, 0], [0, D, H], [0, 0, H]], 'rgba(60,50,35,.11)');
    seg([[0, 0, 0], [W, 0, 0], [W, D, 0], [0, D, 0]], 0.7, '', true);
    seg([[0, 0, 0], [0, 0, H]], 0.3); seg([[W, 0, 0], [W, 0, H], [0, 0, H], [0, D, H], [0, D, 0]], 0.7);
    const thin = 'thin';
    if (R.key === 'anechoic') {
      for (let z = 0.4; z < H - 0.2; z += 0.55) { const pts = []; for (let x = 0; x <= W + 1e-6; x += 0.3) pts.push([x, 0, z + ((x / 0.3) % 2 ? 0.28 : 0)]); seg(pts, 0.22, thin); }
      for (let z = 0.4; z < H - 0.2; z += 0.55) { const pts = []; for (let y = 0; y <= D + 1e-6; y += 0.3) pts.push([0, y, z + ((y / 0.3) % 2 ? 0.28 : 0)]); seg(pts, 0.22, thin); }
      for (let x = 0.5; x < W; x += 0.5) seg([[x, 0, 0.9], [x, D, 0.9]], 0.08, 'thin ghost');
      for (let y = 0.5; y < D; y += 0.5) seg([[0, y, 0.9], [W, y, 0.9]], 0.08, 'thin ghost');
    } else if (R.key === 'bedroom') {
      seg([[0.2, 0.2, 0], [0.2, 0.2, 0.5], [2.2, 0.2, 0.5], [2.2, 1.8, 0.5], [0.2, 1.8, 0.5], [0.2, 0.2, 0.5]], 0.5, thin);
      seg([[2.2, 1.8, 0.5], [2.2, 1.8, 0], [2.2, 0.2, 0], [2.2, 0.2, 0.5]], 0.3, thin);
      seg([[0, 2.2, 1.0], [0, 3.1, 1.0], [0, 3.1, 2.2], [0, 2.2, 2.2]], 0.35, thin, true);
      seg([[0, 2.65, 1.0], [0, 2.65, 2.2]], 0.15, thin);
      seg([[3.0, 0, 0], [3.0, 0, 2.1], [3.9, 0, 2.1], [3.9, 0, 0]], 0.3, thin);
    } else if (R.key === 'classroom') {
      seg([[2, 0, 1.0], [7, 0, 1.0], [7, 0, 2.3], [2, 0, 2.3]], 0.35, thin, true);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { const x = 2.2 + c * 2.2, y = 2.0 + r * 1.2; seg([[x, y, 0.75], [x + 1.4, y, 0.75], [x + 1.4, y + 0.5, 0.75], [x, y + 0.5, 0.75]], 0.06, thin, true); }
      seg([[0, 1.5, 1.0], [0, 3.0, 1.0], [0, 3.0, 2.4], [0, 1.5, 2.4]], 0.25, thin, true);
      seg([[0, 4.2, 1.0], [0, 5.7, 1.0], [0, 5.7, 2.4], [0, 4.2, 2.4]], 0.25, thin, true);
    } else if (R.key === 'boston') {
      seg([[0, 2, 0], [0, 2, 1.2], [8, 2, 1.2], [8, D - 2, 1.2], [0, D - 2, 1.2]], 0.5, thin);
      for (let y = 3; y < D - 3; y += 1.2) seg([[0, y, 4], [0, y, 4 + 7 + Math.sin(y) * 1.5]], 0.04, thin);
      for (const z of [7, 11.5]) seg([[8, 0, z], [W, 0, z]], 0.3, thin);
      for (const z of [7, 11.5]) seg([[0, D, z], [0, D, z]], 0.01, thin);
      for (let x = 11; x < W; x += 1.6) seg([[x, 1.5, 0], [x, D - 1.5, 0]], 0.04, 'thin ghost');
      for (let x = 2; x < W; x += 4.5) seg([[x, 0, H], [x, D, H]], 0.06, 'thin ghost');
    } else if (R.key === 'cathedral') {
      for (let x = 6; x < W - 4; x += 9) {
        const a = [], w = 3.2, top = 22;
        for (let k = 0; k <= 16; k++) { const u = k / 16, ang = u * Math.PI / 2; a.push([x - w + w * (1 - Math.cos(ang)), 0, 6 + (top - 6) * Math.sin(ang) ** 0.9]); }
        for (let k = 0; k <= 16; k++) { const u = k / 16, ang = (1 - u) * Math.PI / 2; a.push([x + w - w * (1 - Math.cos(ang)), 0, 6 + (top - 6) * Math.sin(ang) ** 0.9]); }
        seg([[x - w, 0, 0], ...a, [x + w, 0, 0]], 0.18, thin);
      }
      const rw = []; for (let k = 0; k <= 40; k++) { const a = k / 40 * 2 * Math.PI; rw.push([0, D / 2 + 6 * Math.cos(a), 22 + 6 * Math.sin(a)]); }
      seg(rw, 0.5, thin);
      for (let x = 12; x < W; x += 9) seg([[x, 3, 0], [x, D - 3, 0]], 0.05, 'thin ghost');
    }
    // scale figure, 1.7 m
    const fx = R.key === 'anechoic' ? W * 0.55 : W * 0.7, fy = D * 0.72;
    seg([[fx, fy, 0], [fx, fy, 1.45]], 0.2, 'red'); seg([[fx - 0.001, fy, 1.6], [fx + 0.001, fy, 1.6]], 0.05, 'red');
    return t;
  }

  // ---------- the sheet: paper grid ----------
  function drawSheet() {
    const c = document.getElementById('sheet').getContext('2d');
    c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper'); c.fillRect(0, 0, 1080, 1440);
    for (let x = 48; x <= 1032; x += 24) { c.strokeStyle = (x - 48) % 120 ? 'rgba(205,199,186,.45)' : 'rgba(190,183,168,.7)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + 0.5, 48); c.lineTo(x + 0.5, 1392); c.stroke(); }
    for (let y = 48; y <= 1392; y += 24) { c.strokeStyle = (y - 48) % 120 ? 'rgba(205,199,186,.45)' : 'rgba(190,183,168,.7)'; c.beginPath(); c.moveTo(48, y + 0.5); c.lineTo(1032, y + 0.5); c.stroke(); }
    c.strokeStyle = '#1d1c1a'; c.lineWidth = 2.5; c.strokeRect(36, 36, 1008, 1368); c.lineWidth = 1; c.strokeRect(48, 48, 984, 1344);
    // paper fibre: faint deterministic speckle so the sheet is not flat
    const r = E.rng(5); for (let i = 0; i < 2600; i++) { c.fillStyle = `rgba(120,105,80,${(r() * 0.05).toFixed(3)})`; c.fillRect(r() * 1080, r() * 1440, 1 + r() * 2, 1); }
  }

  // ---------- decay chart (shared by the rooms scene) ----------
  const CH = { x: 150, y: 742, w: 820, h: 250, tmax: 7, dbmin: -66 };
  const cx = tt => CH.x + clamp(tt / CH.tmax) * CH.w, cy = db => CH.y + clamp(db / CH.dbmin) * CH.h;
  function chartFrame(svg, pen, t0) {
    pen.add(M([[CH.x, CH.y - 14], [CH.x, CH.y + CH.h], [CH.x + CH.w + 14, CH.y + CH.h]]), t0, 0.6);
    for (let db = -10; db >= -60; db -= 10) pen.add(M([[CH.x, cy(db)], [CH.x + CH.w, cy(db)]]), t0 + 0.3, 0.5, 'thin ghost' + (db === -60 ? '' : ' dash'));
    for (let k = 1; k <= 7; k++) pen.add(M([[cx(k), CH.y + CH.h], [cx(k), CH.y + CH.h + 10]]), t0 + 0.4, 0.2, 'thin');
    const g = s('g', { class: 'chartlab' });
    g.append(s('text', { x: CH.x - 16, y: cy(0) + 7, 'text-anchor': 'end', class: 'mono', 'font-size': 18, fill: 'var(--ink2)', text: '0' }));
    for (let db = -20; db >= -60; db -= 20) g.append(s('text', { x: CH.x - 16, y: cy(db) + 7, 'text-anchor': 'end', class: 'mono', 'font-size': 18, fill: 'var(--ink2)', text: db }));
    for (let k = 1; k <= 7; k++) g.append(s('text', { x: cx(k), y: CH.y + CH.h + 36, 'text-anchor': 'middle', class: 'mono', 'font-size': 18, fill: 'var(--ink2)', text: k }));
    g.append(s('text', { x: CH.x, y: CH.y - 26, class: 'mono', 'font-size': 18, fill: 'var(--ink2)', text: '声压级 dB  ·  拍手之后的衰减（示意）' }));
    g.append(s('text', { x: CH.x + CH.w, y: CH.y + CH.h + 36, 'text-anchor': 'end', class: 'mono', 'font-size': 18, fill: 'var(--ink2)', text: '秒' }));
    svg.append(g); return g;
  }

  // ---------- caption renderer: the whole sentence, typed in ----------
  function caption(t) {
    const st = E.sayAt(t), root = document.getElementById('cap');
    if (!st) { root.style.opacity = 0; if (root._st) { root.replaceChildren(); root._st = null; } return; }
    if (root._st !== st) {
      root._st = st;
      root._spans = st.tokens.map(tk => { const sp = h('span', { class: 'w' + (tk.hl ? ' hl' : '') }, h('b', { text: tk.d }), tk.p ? h('i', { text: tk.p }) : null); sp._tk = tk; return sp; });
      root.replaceChildren(...root._spans);
    }
    root.style.opacity = 1 - p(t, st.end + 0.05, 0.2);
    for (const sp of root._spans) sp.style.setProperty('--k', p(t, sp._tk.t0, 0.08).toFixed(3));
  }

  // ---------- scenes ----------
  const scenes = {
    open: (sc, el) => {
      const svg = s('svg', { class: 'dw', viewBox: '0 0 1080 1440' }); el.append(svg);
      const pen = Pen(svg);
      // a hand: two strokes; the clap: rings on the floor plan of an empty room
      const P = isoFit(10, 8, 3.2, { x: 140, y: 230, w: 800, h: 560 });
      const end = roomStrokes(pen, { key: 'empty', dims: [10, 8, 3.2] }, P, 0.3);
      const rings = s('g'); svg.append(rings);
      const ringEls = Array.from({ length: 7 }, () => { const e = s('ellipse', { class: 'stk red', fill: 'none' }); rings.append(e); return e; });
      const c0 = P(5, 4, 0);
      const k1 = label(el, 84, 860, '拍手 ×1 · 普通教室（模拟）', 'tag');
      return lt => {
        pen.update(lt);
        const tc = E.cue(sc, 'clip_c_open', 99);
        ringEls.forEach((e, i) => {
          const u = (lt - tc - i * 0.09) / 1.4;
          if (u < 0 || u > 1) { e.style.opacity = 0; return; }
          const r = 20 + u * 520; e.setAttribute('cx', c0[0]); e.setAttribute('cy', c0[1]); e.setAttribute('rx', r * C30 * 1.15); e.setAttribute('ry', r * S30 * 1.15);
          e.style.opacity = (1 - u) ** 1.6 * (i ? 0.6 : 1); e.style.strokeWidth = i ? 1.2 : 2.4;
        });
        fade(k1, p(lt, tc, 0.3) * (1 - p(lt, tc + 2.2, 0.4)));
      };
    },

    rooms: (sc, el) => {
      const svg = s('svg', { class: 'dw', viewBox: '0 0 1080 1440' }); el.append(svg);
      const chartPen = Pen(svg);
      chartFrame(svg, chartPen, 0.2);
      const rooms = sc.data.rooms;
      const groups = rooms.map((R, i) => {
        const g = s('g'); svg.append(g); const pen = Pen(g);
        const t0 = E.cue(sc, 'r' + i, 1) + 0.05;
        const P = isoFit(R.dims[0], R.dims[1], R.dims[2], { x: 100, y: 340, w: 560, h: 350 });
        roomStrokes(pen, R, P, t0);
        const name = h('div', { class: 'lab', style: 'left:84px;top:176px' }, h('div', { class: 'rno', text: R.no + ' / 05' }), h('div', { class: 'rname', text: R.name }), h('div', { class: 'tag', text: R.note, style: 'margin-top:6px' }));
        el.append(name);
        const big = h('div', { class: 'lab big', style: 'right:96px;top:330px;font-size:150px;text-align:right' });
        const unit = h('div', { class: 'lab tag', style: 'right:100px;top:300px;text-align:right', text: '混响时间 T · 秒' });
        el.append(big, unit);
        // decay line in the chart
        const line = s('path', { class: 'stk red', d: '' }); svg.append(line);
        const tag = s('text', { class: 'mono', 'font-size': 20, fill: 'var(--ink2)', x: CH.x + CH.w - 200, y: CH.y + 14 + i * 30, text: '' }); svg.append(tag);
        const sw = s('path', { class: 'stk', d: M([[CH.x + CH.w - 240, CH.y + 7 + i * 30], [CH.x + CH.w - 212, CH.y + 7 + i * 30]]) }); svg.append(sw);
        const scaleM = P.sc;
        tag.textContent = R.name + (R.key === 'anechoic' ? '  ≈ 0 s' : '  ' + R.Tlabel + ' s');
        return { R, g, pen, name, big, unit, line, tag, sw, t0, scaleM };

      let cur = E.TL.scenes[0];
      for (const sc of E.TL.scenes) if (t >= sc.start - 0.01) cur = sc;
      document.getElementById('hno').textContent = cur.data.no || '';
      document.getElementById('htitle').textContent = cur.data.title || '';
      document.getElementById('tbno').textContent = cur.data.no || '';
      document.getElementById('tbname').textContent = cur.data.title || '';
      const listen = ['rooms', 'fogg', 'music', 'aural'].includes(cur.type) || (cur.type === 'open' && t - cur.start > E.cue(cur, 'hp', 99) - 0.1);
      document.getElementById('hp').style.opacity = listen ? 1 : 0;
      const sc2 = document.getElementById('scale'); sc2.style.opacity = cur.type === 'rooms' ? 1 : 0;
      const head = p(t, cur.start, 0.4); ['hno', 'htitle'].forEach(id => { document.getElementById(id).style.opacity = cur.i === 0 ? p(t, 0.2, 0.5) : head; });
    },
    transition(sc, t) {
      const kin = sc.i === 0 ? 1 : p(t, sc.start, 0.35), kout = 1 - p(t, sc.end, 0.3, ease.in);
      sc.el.style.opacity = kin * kout;
    },
    after(t) { caption(t); },
  });
})();
</script></body></html>
