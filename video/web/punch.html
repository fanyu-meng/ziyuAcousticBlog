<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/anton/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/space-grotesk/700.css">
<style>
/* E · 卡片快剪风：米黄点阵底、粗黑描边卡片、硬阴影、下半屏逐词弹出的大字幕。每篇的卡片在 punch/<key>.js */
:root{--paper:#fff4d6;--yel:#ffe600;--org:#ff7a1a;--blue:#2463ff;--pink:#ff2e63;--green:#14a35a;--font:"Noto Sans SC",sans-serif}
html,body{margin:0;background:var(--paper)}
#stage{position:relative;width:1080px;height:1440px;overflow:hidden;font-family:var(--font);color:#111;background:var(--paper);
  background-image:radial-gradient(rgba(0,0,0,.11) 2px,transparent 2.4px);background-size:36px 36px}
#hdr{position:absolute;left:44px;top:40px;height:88px;padding:0 34px;border-radius:50px;background:#111;color:var(--yel);display:flex;align-items:center;font-family:"Anton","Noto Sans SC";font-size:50px;letter-spacing:3px;white-space:nowrap;box-shadow:7px 7px 0 var(--pink)}
#brand{position:absolute;right:48px;top:66px;font-size:30px;font-weight:900;letter-spacing:3px}
#segs{position:absolute;left:44px;right:44px;top:150px;height:40px;display:flex;gap:10px}
.seg{position:relative;flex:1;height:12px;border:3px solid #111;border-radius:8px;background:#fff;overflow:hidden}
.seg b{position:absolute;left:0;top:0;bottom:0;background:#111}
.seg.on b{background:var(--pink)}
.segl{position:absolute;top:22px;font-size:22px;font-weight:700;color:#7a6a3a;white-space:nowrap}
.segl.on{color:#111}
#layer{position:absolute;inset:0}
.scene{position:absolute;left:54px;top:236px;width:972px;height:730px}
.card{position:absolute;inset:0;background:#fff;border:6px solid #111;border-radius:30px;box-shadow:14px 14px 0 #111;transform-origin:50% 60%;overflow:visible}
.tagl{position:absolute;left:26px;top:-36px;z-index:3;background:#111;color:var(--yel);font-size:36px;font-weight:900;padding:8px 24px;border-radius:12px;transform:rotate(-3deg);box-shadow:5px 5px 0 var(--pink);white-space:nowrap}
.emo{position:absolute;right:-14px;bottom:-40px;font-size:120px;line-height:1;z-index:4;font-family:"Noto Color Emoji";transform-origin:50% 80%}
#cap{position:absolute;left:36px;right:36px;top:1010px;height:360px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;font-size:94px;line-height:1.24;font-weight:900;text-align:center}
#cap .w{display:inline-block;white-space:pre;opacity:calc(var(--k)*1.4);transform:scale(calc(.45 + .55*var(--k)));transform-origin:50% 85%}
#cap .w b{font-weight:900;position:relative;padding:0 4px;border-radius:10px}
#cap .w i{font-style:normal}
#cap .w.cur b{background:var(--yel);box-shadow:0 0 0 6px var(--yel)}
#cap .w.hl b{color:var(--pink)}
#cap .w.hl.cur b{background:#111;box-shadow:0 0 0 6px #111;color:var(--yel)}
#foot{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:22px;font-weight:700;color:#9a8a5a;letter-spacing:2px}
/* shared pieces */
.blk{position:absolute;font-weight:900;white-space:nowrap;border:6px solid #111;border-radius:22px;box-shadow:10px 10px 0 #111;padding:10px 30px;transform-origin:50% 50%}
.chip{position:absolute;font-size:36px;font-weight:900;padding:10px 24px;border:5px solid #111;border-radius:40px;background:#fff;box-shadow:6px 6px 0 #111;white-space:nowrap;transform-origin:0 50%}
.big{position:absolute;font-family:"Anton","Noto Sans SC";line-height:1;white-space:nowrap}
.row{position:absolute;left:40px;right:40px;height:96px;display:flex;align-items:center;gap:22px;font-size:44px;font-weight:900;white-space:nowrap;border-radius:18px;padding:0 18px;transform-origin:0 50%}
.row .ic{flex:none;width:64px;height:64px;border:5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.row .ic.x{background:var(--pink)}.row .ic.v{background:var(--green)}
.row small{font-size:32px;font-weight:700;color:#666}
.row.now{background:var(--yel);box-shadow:0 0 0 4px #111}
.sheet{position:absolute;width:170px;height:214px;background:#fff;border:5px solid #111;border-radius:14px;box-shadow:7px 7px 0 #111;transform-origin:50% 100%}
.sheet i{position:absolute;left:20px;height:9px;border-radius:5px;background:#cfcfcf}
.sheet .x{position:absolute;left:12px;height:7px;border-radius:4px;background:var(--pink);transform-origin:0 50%}
.sheet .n{position:absolute;left:20px;height:9px;border-radius:5px;background:var(--blue);transform-origin:0 50%}
.sheet em{position:absolute;left:0;right:0;bottom:-58px;text-align:center;font-style:normal;font-size:28px;font-weight:900}
.small{position:absolute;font-size:28px;font-weight:700;color:#666;white-space:nowrap}
</style></head>
<body><div id="stage">
<div id="hdr"></div><div id="brand"></div>
<div id="segs"></div>
<div id="layer"></div>
<div id="cap"></div>
<div id="foot"></div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  const { h, s, p, ease, clamp, lerp } = E;
  const $ = id => document.getElementById(id);
  const PINK = '#ff2e63', BLUE = '#2463ff', ORG = '#ff7a1a', GREEN = '#14a35a';
  const pop = (el, k, base = '') => { el.style.opacity = clamp(k * 2); el.style.transform = `${base} scale(${(0.6 + 0.4 * k).toFixed(3)})`; };

  // a card with its sticker and emoji; returns the card body and an updater for the entrance / exit
  function card(sc, el) {
    const c = h('div', { class: 'card' });
    if (sc.data.tag) c.append(h('div', { class: 'tagl', text: sc.data.tag }));
    const emo = sc.data.emoji ? h('div', { class: 'emo', text: sc.data.emoji }) : null;
    if (emo) c.append(emo);
    el.append(c);
    const up = lt => {
      const k = p(lt, 0, 0.45, ease.back), out = p(lt, sc.dur - 0.28, 0.28, ease.in);
      c.style.opacity = clamp(k * 2) * (1 - out);
      c.style.transform = `translateX(${(-out * 1100).toFixed(0)}px) rotate(${((1 - k) * -4 + out * -6).toFixed(2)}deg) scale(${(0.82 + 0.18 * k).toFixed(3)})`;
      if (emo) emo.style.transform = `rotate(${(Math.sin(lt * 3.2) * 8).toFixed(1)}deg) scale(${p(lt, 0.3, 0.4, ease.back).toFixed(3)})`;
    };
    return { c, up };
  }
  const C = (sc, n) => E.cue(sc, n);
  // a curve drawn with stroke-dashoffset
  const curve = (d, color, w) => s('path', { d, stroke: color, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 });
  const draw = (path, k) => path.setAttribute('stroke-dashoffset', (1 - k).toFixed(4));

  // ---------- cards: drawn by punch/<TL.meta.punch>.js, which defines window.PUNCH(api) -> { <scene type>: (sc, el) => updater } ----------
  // api: card(sc, el) -> {c, up}  the scene's card (sticker = sc.data.tag, emoji = sc.data.emoji); call up(lt) every frame
  //      pop(el, k, baseTransform)  pop an element in, k = 0..1      C(sc, cue)  local time of a [[cue]] in the narration
  //      curve(d, color, width) / draw(path, k)  an SVG path drawn along as k goes 0..1
  //      classes in this page: .blk big bordered block, .chip pill label, .row checklist row (.ic.x / .ic.v, .now), .sheet paper, .small grey note
  let scenes = {};

  // ---------- header, chapter progress ----------
  let segs = [];
  function chrome(TL) {
    $('hdr').textContent = TL.meta.tag; $('brand').textContent = TL.meta.brand;
    const box = $('segs');
    segs = TL.meta.chapters.map(([id, name]) => {
      const sc = TL.scenes.find(x => x.id === id), b = h('b', {}), seg = h('div', { class: 'seg' }, b), l = h('div', { class: 'segl', text: name });
      seg.append(l); box.append(seg); return { sc, b, seg, l };
    });
    segs.forEach(o => { o.l.style.position = 'absolute'; o.l.style.left = '0'; o.l.style.top = '14px'; o.seg.style.overflow = 'visible'; });
  }

  const load = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); });
  (async () => {
  await load(new URLSearchParams(location.search).get('tl'));
  await load('punch/' + window.TL.meta.punch + '.js');
  scenes = window.PUNCH({ h, s, p, ease, clamp, lerp, E, card, curve, draw, pop, C, PINK, BLUE, ORG, GREEN });
  E.start({
    fonts: ['500 40px "Noto Sans SC"', '700 40px "Noto Sans SC"', '900 40px "Noto Sans SC"', '400 40px "Anton"', '700 40px "Space Grotesk"'],
    get extraText() { return $('layer').textContent + '0123456789#·→↑✓✗×+=：，！？'; },   // every string on the cards, read once they are built
    layer: $('layer'),
    init(stage, TL) { chrome(TL); },
    scenes,
    frame(t) {
      segs.forEach(o => {
        const k = clamp((t - o.sc.start) / (o.sc.end - o.sc.start));
        o.b.style.width = (k * 100).toFixed(1) + '%';
        const on = t >= o.sc.start && t < o.sc.end; o.seg.classList.toggle('on', on); o.l.classList.toggle('on', on);
      });
    },
    after: (() => { let capF = null; return t => { if (!capF) capF = E.Captions($('cap'), { max: E.TL.meta.capMax || 9 }); capF(t); }; })(),
  });
  })();
})();
</script></body></html>
